train_path = "path/to/trainset.json" # for finetuning
eval_path = "path/to/devset.json"
track = "simple"                     # "simple" (labels 0-4) or "rubric" (labels 0-2)
prompt = "simple/zero_shot"          # prompt builder from src/prompt.py
langs = ["en"]                       # languages to keep; [] or not specified = all

# names the results file, e.g. results/<track>/<model>/<prompt>/balanced.json.
# Inferred from eval_path when omitted; mirror it in the config filename.
dataset = "regular"                  # "regular" (released split) or "balanced" (src/make_split.py)

# which model to run (a description of each architecture can be found in the report):
#   baselines (no finetuning):
#       "2.0/mlm" 
#       "3.0/gpt_bert/mlm"
#   finetuning:
#       "2.0/cls"
#       "3.0/gpt_bert/cls"
#       "3.0/gpt_bert/instruction_tune"
#       "3.0/t5/instruction_tune"
model = "2.0/mlm"      

# maximum length of the context to feed into model,
# the rest is truncated
max_length = 512 

# maximum amount of new tokens to be generated by autoregressive models
# 0 disables generation
max_new_tokens = 8              

# finetuning parameters (used only when train_path is set)
epochs = 1
lr = 1e-5
train_batch_size = 4    # defaults to batch_size
train_limit = 0         # how many training records to use; 0 or absent = all

# run parameters
batch_size = 16
device = "cuda"
output_dir = "results"  # where to store the results
limit = 32              # how much records to run; 0 or not specified = full run
