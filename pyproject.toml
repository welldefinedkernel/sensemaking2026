[project]
name = "sensemaking-hplt"
version = "1.0.1"
description = "Sensemaking 2026 Shared Task using HPLT models."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "accelerate>=1.14.0",
    "deep-translator>=1.11.4",
    "scikit-learn>=1.9.0",
    "torch>=2.13.0",
    "transformers>=4.57.6,<5",
]

[dependency-groups]
dev = [
    "pyclean>=3.7.0",
    "ruff>=0.15.22",
]

[tool.ruff]
cache-dir = ".cache/ruff"
